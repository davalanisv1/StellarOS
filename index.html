<!DOCTYPE html>

<html>

    <body  style="background-size: cover; font-family:Avantgarde, TeX Gyre Adventor, URW Gothic L, sans-serif; background-image: url('/images/int.jpg')">
        

        
        <div id="welcome" class="window" style="text-align:center; top: 50%;  left: 50%; transform: translate(-50%, -50%);">
            
            <button class="closebutton" id="welcomeclose" type="button" aria-label="Close welcome window" title="Close"></button>
            <p class="windowheader" id="welcomeheader">-----</p>

            <img src="https://image.tmdb.org/t/p/original/7uCL4gbdmokTWyeYbJxwBo5pbVT.jpg" style="width: 166px; height: 166px; border-radius: 100px;">
            
            <h1 style="color: #ffff; cursor:pointer" id="welcomeopen"><b>StellarOS</b></h1>
            
            <h2 style="color: #ffff"><i>A web-based OS inspired on the movie Interstellar</i></h2>
            
            <p style="color:#ffff">A WebOS for Stardance, based on my favorite movie <i>"Interstellar"</i></p>
        
        </div>

        <div id="toolbar" class="toolbar">
            
            <p id="toolbaropen" style="color: #ffff; cursor: pointer" title="Open welcome window"><b>StellarOS</b></p>
            
            <p id="time" style="color: #ffff"><b>Loading...</b></p>

        </div>

	    <div id="notesshortcut" style="padding-top: 64px; padding-left: 16px; color:#ffff">
            <img id="notesicon"src="/images/notes.png" style="height:50px; width:50px; transform: scale(2)">
		    <p>Notes</p>
	    </div>
        
    <div id="cursorIndicator" aria-hidden="true"></div>
    <div class="window" id="notes" style="display: none; top: calc(50% - 240px); left: calc(50% - 260px); position: absolute; border: solid #ff831d; width: 520px; height: 480px; box-sizing: border-box; border-radius: 32px; background-color: #2b1800a8; backdrop-filter: blur(10px); flex-direction: column; overflow: hidden;">
        <div class="windowheader" id="notesheader" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0 16px; color: #fff;">
            <div class="closebutton" id="notesclose" aria-label="Close notes window" title="Close" style="cursor: pointer;"></div>
            <p class="windowheader" id="notesheader">---</p>
        </div>

        <div style="display: flex; flex-direction: row; flex-grow: 1; padding: 16px; box-sizing: border-box; overflow: hidden; font-family: Courier, monospace;">
            <div id="sidebar" style="background-color: rgba(249, 249, 249, 0.15); width: 150px; margin-right: 16px; padding: 12px; border-radius: 16px; overflow-y: auto; flex-shrink: 0; text-align: left;">
            </div>

            <div style="overflow-y: auto; flex-grow: 1; text-align: left; padding-right: 4px; color: #fff;">
                <div id="notesContent" contenteditable="true" style="outline: none; min-height: 100%; color: #fff">
                </div>
            </div>
        </div>
    </div>



        <script src="/assets/script.js"></script>
        <script src="/assets/apps.js"></script>
        <link rel="stylesheet" type="text/css" href="assets/style.css" />

    </body>

</html>
