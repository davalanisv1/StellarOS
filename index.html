<!DOCTYPE html>

<html>

    <body style="background-size: cover; font-family:Avantgarde, TeX Gyre Adventor, URW Gothic L, sans-serif; background-image: url('/images/int.jpg')">
        

        
        <div id="welcome" class="window" style="text-align:center; top: 50%;  left: 50%; transform: translate(-50%, -50%);">
            
            <button class="closebutton" id="welcomeclose" type="button" aria-label="Close welcome window" title="Close"></button>
            <p class="windowheader" id="welcomeheader">-----</p>

            <img src="https://image.tmdb.org/t/p/original/7uCL4gbdmokTWyeYbJxwBo5pbVT.jpg" style="width: 166px; height: 166px; border-radius: 100px;">
            
            <h1 style="color: #ffff; cursor:pointer" id="welcomeopen"><b>StellarOS</b></h1>
            
            <h2 style="color: #ffff"><i>A web-based OS inspired on the movie Interstellar</i></h2>
            
            <p style="color:#ffff">A WebOS for Stardance, based on my favorite movie <i>"Interstellar"</i></p>
        
        </div>

        <div id="toolbar" class="toolbar">
            
            <p id="toolbaropen" style="color: #ffff; cursor: pointer" title="Open welcome window"><b>StellarOS</b></p>
            
            <p id="time" style="color: #ffff"><b>Loading...</b></p>

        </div>

	    <div id="desktopApps" style="padding-top: 64px; padding-left: 16px; color:#ffff">

		    <p>Notes</p>
	    </div>

            <p class="windowheader" id="notesheader">-----</p>
            
            <h1 style="color: #ffff; cursor:pointer"><b>Notes</b></h1>

            <p style="color:#ffff">get to notetaking brah</i></p>

        <link rel="stylesheet" type="text/css" href="assets/style.css" />
